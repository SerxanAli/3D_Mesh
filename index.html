<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Modellərim</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #12151a;
            color: #f3f4f6;
            font-family: Arial, sans-serif;
            padding: 36px 20px;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 28px;
            font-size: 28px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .card {
            position: relative;
            background: #1d222b;
            border: 1px solid #2e3645;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #4f8cff;
        }

        .card model-viewer {
            width: 100%;
            height: 220px;
            display: block;
            background: #161a21;
        }

        .card-footer {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-size: 17px;
            font-weight: bold;
        }

        .card-action {
            font-size: 13px;
            color: #7aa7ff;
        }

        /* Kartın üzərindəki modelə siçan toxunması keçidə mane olmasın */
        .card-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
        }

        /* Eyni səhifədə böyük model pəncərəsi */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 14, 0.92);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.open {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 920px;
            height: 75vh;
            background: #1a1f28;
            border: 1px solid #323b4c;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-top {
            padding: 14px 18px;
            background: #222834;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-close {
            background: #333c4d;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-close:hover {
            background: #48546b;
        }

        .modal model-viewer {
            width: 100%;
            flex: 1;
            background: #141820;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>3D Modellərim</h1>

        <div class="grid">
            <!-- Yeni model əlavə etmək üçün bu <div class="card"> blokunu kopyalayıb yapışdır -->
            <div class="card" data-title="myRob" data-glb="https://serxanali.github.io/myRob/model.glb">
                <model-viewer
                    src="https://serxanali.github.io/myRob/model.glb"
                    alt="myRob 3D modeli"
                    auto-rotate
                    shadow-intensity="0.8"
                    exposure="1">
                </model-viewer>
                <div class="card-footer">
                    <span class="card-title">myRob</span>
                    <span class="card-action">Böyüt</span>
                </div>
                <div class="card-overlay"></div>
            </div>
        </div>
    </div>

    <!-- Eyni səhifədə açılan böyük 3D baxış pəncərəsi -->
    <div class="modal" id="modelModal">
        <div class="modal-box">
            <div class="modal-top">
                <strong id="modalTitle">3D Model</strong>
                <button class="modal-close" id="closeModal" type="button">Bağla (X)</button>
            </div>
            <model-viewer
                id="modalViewer"
                src=""
                alt="Böyük 3D model"
                camera-controls
                auto-rotate
                shadow-intensity="1"
                exposure="1">
            </model-viewer>
        </div>
    </div>

    <script>
        const modal = document.getElementById("modelModal");
        const modalViewer = document.getElementById("modalViewer");
        const modalTitle = document.getElementById("modalTitle");
        const closeModal = document.getElementById("closeModal");

        document.querySelectorAll(".card").forEach((card) => {
            card.addEventListener("click", () => {
                const glbUrl = card.getAttribute("data-glb");
                const title = card.getAttribute("data-title");
                modalTitle.textContent = title;
                modalViewer.src = glbUrl;
                modal.classList.add("open");
            });
        });

        closeModal.addEventListener("click", () => {
            modal.classList.remove("open");
            modalViewer.src = "";
        });

        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.classList.remove("open");
                modalViewer.src = "";
            }
        });
    </script>

</body>
</html>
