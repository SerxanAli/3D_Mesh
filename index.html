<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Modellərim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #12151a;
            color: #f3f4f6;
            font-family: Arial, sans-serif;
            padding: 36px 20px;
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 28px;
            font-size: 28px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }

        .card {
            position: relative;
            background: #1d222b;
            border: 1px solid #2e3645;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #4f8cff;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            background: #161a21;
        }

        .card-footer {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-size: 17px;
            font-weight: bold;
        }

        .card-action {
            font-size: 13px;
            color: #7aa7ff;
        }

        .card-link {
            position: absolute;
            inset: 0;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>3D Modellərim</h1>

        <div class="grid">
            <!-- Yeni model əlavə etmək üçün bu <div class="card"> blokunu kopyalayıb yapışdır -->
            <div class="card">
                <!-- myRob qovluğuna atdığın şəklin dəqiq adını buraya yaz (məsələn: myRob.png) -->
                <img src="https://serxanali.github.io/myRob/myRob.png" alt="myRob 3D modeli">
                <div class="card-footer">
                    <span class="card-title">myRob</span>
                    <span class="card-action">Böyüt →</span>
                </div>
                <a class="card-link" href="https://serxanali.github.io/myRob/" aria-label="myRob modelini aç"></a>
            </div>
        </div>
    </div>

</body>
</html>
